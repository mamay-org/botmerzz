name: Publish container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish commit-SHA image
        id: publish
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record pinned image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Commit: ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA tag: ${IMAGE_NAME}:${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned image: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

# VPS deployment is intentionally not configured. Add a separately reviewed
# workflow_dispatch deployment after VPS credentials, staging, and rollback are approved.
