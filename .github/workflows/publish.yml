name: Publish container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_digest: ${{ steps.publish.outputs.digest }}
      commit_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish commit-SHA image
        id: publish
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record pinned image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Commit: ${COMMIT_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA tag: ${IMAGE_NAME}:${COMMIT_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Digest-pinned image: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  deploy-staging:
    needs: publish
    if: >-
      ${{
        needs.publish.result == 'success' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.STAGING_DEPLOY_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: botmerzz-staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
      IMAGE_REF: ${{ needs.publish.outputs.image_name }}@${{ needs.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}

      - name: Configure pinned SSH access
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_SSH_HOST:?Configure the staging environment SSH host secret}"
          : "${STAGING_SSH_USER:?Configure the staging environment SSH user secret}"
          : "${STAGING_SSH_PRIVATE_KEY:?Configure the staging environment private key secret}"
          : "${STAGING_SSH_KNOWN_HOSTS:?Configure the verified staging known_hosts secret}"
          : "${GHCR_TOKEN:?GITHUB_TOKEN is required to pull the published image}"
          [[ "${STAGING_SSH_HOST}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$ ]]
          [[ "${STAGING_SSH_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "${COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${IMAGE_REF}" =~ ^ghcr\.io/mamay-org/botmerzz@sha256:[a-f0-9]{64}$ ]]

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${STAGING_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/botmerzz-staging"
          chmod 600 "${HOME}/.ssh/botmerzz-staging"
          printf '%s\n' "${STAGING_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "${STAGING_SSH_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Deploy digest to staging VPS
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          app_dir=/opt/botmerzz-staging
          [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
          auth_dir="/run/botmerzz-ghcr-${GITHUB_RUN_ID}"
          remote_compose="${app_dir}/compose.vps.yaml.next.${GITHUB_RUN_ID}"
          remote_script="${app_dir}/deploy-staging.sh.next.${GITHUB_RUN_ID}"
          ssh_args=(-i "${HOME}/.ssh/botmerzz-staging" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts")

          remote_cleanup() {
            ssh "${ssh_args[@]}" "${target}" \
              "DOCKER_CONFIG='${auth_dir}' docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- '${auth_dir}'; rm -f -- '${remote_compose}' '${remote_script}'" \
              >/dev/null 2>&1 || true
          }
          trap remote_cleanup EXIT

          ssh "${ssh_args[@]}" "${target}" \
            "test -d '${app_dir}' && test -w '${app_dir}' && install -d -m 700 '${auth_dir}'"
          scp "${ssh_args[@]}" compose.vps.yaml "${target}:${remote_compose}"
          scp "${ssh_args[@]}" scripts/deploy-staging.sh "${target}:${remote_script}"
          ssh "${ssh_args[@]}" "${target}" "chmod 700 '${remote_script}'"

          printf '%s' "${GHCR_TOKEN}" | ssh "${ssh_args[@]}" "${target}" \
            "DOCKER_CONFIG='${auth_dir}' docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"

          ssh "${ssh_args[@]}" "${target}" \
            "DOCKER_CONFIG='${auth_dir}' /bin/bash '${remote_script}' '${COMMIT_SHA}' '${IMAGE_REF}' '${remote_compose}'"

      - name: Record staging deployment
        if: success()
        env:
          COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
          IMAGE_REF: ${{ needs.publish.outputs.image_name }}@${{ needs.publish.outputs.image_digest }}
        run: |
          echo "Staging deployed commit: ${COMMIT_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Staging image: ${IMAGE_REF}" >> "${GITHUB_STEP_SUMMARY}"
