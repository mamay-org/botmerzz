name: botmerzz-test

services:
  mysql:
    container_name: botmerzz-p1-final-test
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_DATABASE: merzz_test
      MYSQL_USER: merzz_test
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:-test-password-only}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:-root-test-password-only}
      MYSQL_ROOT_HOST: "%"
      TZ: UTC
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-3307}:3306"
    volumes:
      - botmerzz_test_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0

volumes:
  botmerzz_test_mysql_data:
    name: botmerzz_test_mysql_data
